<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mundial TikTok HUD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="top-control-bar">
        <div class="control-group">
            <input type="text" class="input-user" value="chule_sv14">
            <button class="btn-action-top btn-pink">Conectar</button>
        </div>
        
        <div class="control-group">
            <select class="input-user" id="select-duration">
                <option value="60">1 min</option>
                <option value="120">2 min</option>
            </select>
            <button id="btn-iniciar" onclick="iniciarPartido()">INICIAR BATTLE</button>
        </div>
        
        <button class="btn-action-top btn-green-pill" onclick="openSetupModal()">Nueva Ronda</button>
    </div>

    <div class="modal-overlay" id="modal-setup">
        <div class="modal-title-main">ELIGE 16 PAÍSES</div>
        <div class="modal-subtitle" id="modal-counter-label">Seleccionados: 0 / 16</div>
        <div class="flag-selection-grid" id="flag-grid-target"></div>
        <button class="btn-start-tournament" id="btn-submit-tournament" disabled onclick="aplicarNuevaRonda()">Comenzar Torneo</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
